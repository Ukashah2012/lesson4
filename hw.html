<body>
    <h2>JavaScript Error Handling and Arrow Function</h2>
    <p>This example demonstrates how to use <b>catch</b> to display an error.</p>
    <p id="result"></p>
    
    <script>
        // Arrow function to do calculation
        const product = (a, b) => a * b;

        try {
            // Purposely committing an error (undefined variable 'a')
            document.getElementById("result").innerHTML = a;
        } catch (err) 
        {
            // Error handling
            document.getElementById("result").innerHTML =
                "Error: " + err.message;
        }
            </script>
</body>
</html>
